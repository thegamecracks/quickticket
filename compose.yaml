# https://docs.docker.com/compose/how-tos/multiple-compose-files/include/
include:
  - backend/compose.yaml

services:
  frontend:
    build:
      context: frontend/
      args:
        VITE_API_URL: 'http://127.0.0.1:8000/api'
    ports:
      - 5173:80
    restart: always
    develop:
      watch:
        - action: rebuild
          path: frontend/
