# Use prek as a drop-in replacement for pre-commit: https://prek.j178.dev
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        # ruff only lints Python files, so docs edits do not apply here.
        files: ^(?:src|tests)/|^(?:pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        # ruff format also reformats the Python fences inside markdown files,
        # including the ones at the package root.
        files: ^(?:src|tests)/|^(?:pyproject\.toml|uv\.lock)$|\.md$
        pass_filenames: false

      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        # ty only checks Python files, so docs edits do not apply here.
        files: ^(?:src|tests)/|^(?:pyproject\.toml|uv\.lock)$
        pass_filenames: false
