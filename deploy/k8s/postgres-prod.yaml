# Postgres PROD — Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickticket-postgres-prod
  namespace: quickticket
  labels:
    app: quickticket-postgres-prod
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO PVC — never two pods at once
  selector:
    matchLabels:
      app: quickticket-postgres-prod
  template:
    metadata:
      labels:
        app: quickticket-postgres-prod
    spec:
      containers:
        - name: postgres
          image: postgres:18.4-alpine   # all PG majors get 5yr fixes; 18 = EOL 2030, keep dev/prod in sync
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              value: "quickticket"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quickticket-secret-prod
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "quickticket"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quickticket", "-d", "quickticket"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "quickticket", "-d", "quickticket"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: quickticket-pgdata-prod
---
# Postgres PROD - Service
apiVersion: v1
kind: Service
metadata:
  name: quickticket-postgres-prod
  namespace: quickticket
spec:
  selector:
    app: quickticket-postgres-prod
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: pg
---
# Postgres PROD - longhorn pvc
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quickticket-pgdata-prod
  namespace: quickticket
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
