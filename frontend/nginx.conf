server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router owns client-side paths like /events/:id
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed assets cache forever; index.html must always revalidate
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
