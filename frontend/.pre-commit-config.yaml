# Use prek as a drop-in replacement for pre-commit: https://prek.j178.dev
repos:
  - repo: local
    hooks:
      - id: check
        name: check
        entry: bun run check
        language: system

      - id: format
        name: format
        entry: bun run format
        language: system

      - id: lint
        name: lint
        entry: bun run lint
        language: system
        files: ^(src|tests)/
