x-backend-common: &backend-common
  image: quickticket-backend:latest
  build:
    context: .
  restart: always
  env_file: .env  # copy from example.env
  depends_on:
    cache:
      condition: service_healthy
    db:
      condition: service_healthy
  develop:
    watch:
      - action: sync+restart
        path: ./src
        target: /app/src
        initial_sync: true
      - action: rebuild
        path: pyproject.toml
      - action: rebuild
        path: uv.lock

services:
  backend:
    <<: *backend-common
    ports:
      - 8000:8000
    environment:
      # Point the backend to our cache and database containers, taking precedence over .env.
      BACKEND__CACHE__URL: 'redis://default:abc123@cache:6379'  # 'sqlite:///data/quickticket-cache.db'
      BACKEND__DB__URL: 'postgresql+psycopg://quickticket:abc123@db:5432/quickticket?sslmode=prefer'  # 'sqlite+aiosqlite:///data/quickticket.db'
      BACKEND__S3__URL: 's3+http://s3:3900/quickticket'
      BACKEND__S3__REGION: 'garage'
      BACKEND__S3__ACCESS_KEY: '${BACKEND__S3__ACCESS_KEY:-GK1f12370a0306fcb1d13c3be2304f2d5b}'
      BACKEND__S3__SECRET_KEY: '${BACKEND__S3__SECRET_KEY:-c6c4ca3c65ccb75e024f6106d1781fc3d38c10875c77ff12820617e1a9fc1f1a}'
      FORCE_COLOR: '1'
      ASYNCTASQ_DRIVER: 'redis'
      ASYNCTASQ_REDIS_URL: 'redis://default:abc123@cache:6379'
      COLUMNS: '${COLUMNS}'  # affects rich logging width and wrapping
    volumes:
      # Use this volume if either the cache or database are backed by SQLite.
      - backend-data:/app/data
    pre_start:
      - command: ['alembic', 'upgrade', 'head']  # run migrations on startup

  worker:
    <<: *backend-common
    command: [quickticket, worker]
    environment:
      FORCE_COLOR: '1'
      ASYNCTASQ_DRIVER: 'redis'
      ASYNCTASQ_REDIS_URL: 'redis://default:abc123@cache:6379'
      COLUMNS: '${COLUMNS}'  # affects rich logging width and wrapping

  cache:
    # https://hub.docker.com/_/redis/
    image: docker.io/library/redis:8-alpine
    command:
      - 'redis-server'
      - '/usr/local/etc/redis/redis.conf'
      - '--requirepass'
      - '${REDIS_PASSWORD:-abc123}'
    ports:
      - 127.0.0.1:6379:6379
    environment:
      REDIS_ARGS: 'abc123'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 5s
      retries: 10
    restart: always
    volumes:
      - cache-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro

  db:
    # https://hub.docker.com/_/postgres/
    image: docker.io/library/postgres:18-alpine
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: 'quickticket'
      POSTGRES_DB: 'quickticket'
      POSTGRES_PASSWORD: 'abc123'
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8'
      # Healthcheck
      PGUSER: 'quickticket'
      PGDATABASE: 'quickticket'
      PGPASSWORD: 'abc123'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 1s
      timeout: 5s
      retries: 10
    restart: always
    volumes:
      - db-data:/var/lib/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro

  s3:
    image: docker.io/dxflrs/garage:v2.5.0
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    ports:
      - 127.0.0.1:3900:3900
    environment:
      # https://garagehq.deuxfleurs.fr/documentation/quick-start/#configuring-initial-access-credentials
      GARAGE_DEFAULT_ACCESS_KEY: '${BACKEND__S3__ACCESS_KEY:-GK1f12370a0306fcb1d13c3be2304f2d5b}'
      GARAGE_DEFAULT_SECRET_KEY: '${BACKEND__S3__SECRET_KEY:-c6c4ca3c65ccb75e024f6106d1781fc3d38c10875c77ff12820617e1a9fc1f1a}'
      GARAGE_DEFAULT_BUCKET: 'quickticket'
    restart: always
    volumes:
      - s3-data:/var/lib/garage
      - ./config/garage.toml:/etc/garage.toml:ro

volumes:
  backend-data:
  cache-data:
  db-data:
  s3-data:
