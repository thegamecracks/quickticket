# Use prek as a drop-in replacement for pre-commit: https://prek.j178.dev
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        files: ^(src|tests)
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        files: ^(src|tests)
        pass_filenames: false

      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        files: ^(src|tests)
        pass_filenames: false
