name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", "frontend/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

# one build at a time per branch; a new push to main supersedes a stale build
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/thegamecracks/quickticket-api
  WEB_IMAGE: ghcr.io/thegamecracks/quickticket-web

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.tag || 'dev' }}
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.tag || 'dev' }}
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # dev auto-deploy: only on main pushes, skipped (not failing) until the
  # QT_DEV_KUBECONFIG secret exists
  restart-dev:
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.QT_DEV_KUBECONFIG != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.31.0
      - name: rollout restart quickticket dev
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.QT_DEV_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n quickticket rollout restart deploy/quickticket-dev deploy/quickticket-dev-web
          kubectl -n quickticket rollout status deploy/quickticket-dev --timeout=180s
          kubectl -n quickticket rollout status deploy/quickticket-dev-web --timeout=180s
