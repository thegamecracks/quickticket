[build-system]
requires = ["uv_build~=0.12.17"]
build-backend = "uv_build"

[project]
name = "quickticket"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "thegamecracks", email = "61257169+thegamecracks@users.noreply.github.com" },
    { name = "Ashley Scott", email = "lunarmeadow@protonmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "aioaws>=0.15.1",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.1",
    "joserfc>=1.7.5",
    "limits>=5.8.0",
    "obstore>=0.11.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.15.0",
    "pyinstrument>=5.1.3",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "starlette-securecookies>=1.1.1",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
    "whenever>=0.10.5",
]

[project.scripts]
quickticket = "fastapi_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.fastapi]
entrypoint = "quickticket.app:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
combine-as-imports = true
