name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", "frontend/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

# one build at a time per branch; a new push to main supersedes a stale build
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/thegamecracks/quickticket-api
  WEB_IMAGE: ghcr.io/thegamecracks/quickticket-web

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          tag="dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME#v}"; fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then tag="pr-$PR_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          tag="dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME#v}"; fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then tag="pr-$PR_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # dev auto-deploy: only on main pushes. The kubectl step is skipped
  # (silently, without failing the job) until the QT_DEV_KUBECONFIG secret
  # exists. The secrets context is unavailable inside if: conditionals at
  # ANY level, hence the env: indirection.
  restart-dev:
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      QT_DEV_KUBECONFIG: ${{ secrets.QT_DEV_KUBECONFIG }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
    steps:
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.31.0
      # the k3s API (192.168.10.150:6443) is LAN-only; join the tailnet as an
      # ephemeral node and reach it through dell-pve-1's approved subnet route
      # for 192.168.10.0/24. The kubeconfig's server URL and CA stay untouched
      # (192.168.10.150 is in the API cert's SANs). --accept-routes is required
      # on Linux to learn the subnet route; the node deregisters itself when
      # the job ends (ephemeral).
      - name: join tailnet (headscale)
        if: env.TS_AUTHKEY != ''
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --login-server=https://headscale.vanderloch.com:2459 \
            --authkey="$TS_AUTHKEY" \
            --hostname="gh-qt-${{ github.run_id }}" \
            --ephemeral --accept-routes
      - name: rollout restart quickticket dev
        if: env.QT_DEV_KUBECONFIG != ''
        run: |
          mkdir -p ~/.kube
          printf '%s' "$QT_DEV_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n quickticket rollout restart deploy/quickticket-dev deploy/quickticket-dev-web
          kubectl -n quickticket rollout status deploy/quickticket-dev --timeout=180s
          kubectl -n quickticket rollout status deploy/quickticket-dev-web --timeout=180s
