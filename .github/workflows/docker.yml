# Builds and publishes the api and web images to GHCR.
#
#   push to main        -> :dev (+ :sha) published, dev deployments restarted
#   push tag v1.2.3     -> :1.2.3 published (this is the prod artifact)
#   pull_request        -> build only, nothing published
#
# Prod promotion flow (two PRs, gated by Atlantis):
#   1. here:  git tag v1.x.y && git push origin v1.x.y
#   2. kube repo: PR bumping the pinned tags in
#      terraform/apps/modules/quickticket/app.tf (:1.0.0 -> :1.x.y)
#
# One-time setup for the dev auto-restart job (QT_DEV_KUBECONFIG secret):
# create a least-privilege ServiceAccount in the quickticket namespace and put
# its kubeconfig in repo secrets. Run on the k3s admin box:
#   kubectl -n quickticket create sa qt-deployer
#   kubectl -n quickticket create role qt-deployer \
#     --verb=get,list,watch,patch,update --resource=deployments
#   kubectl -n quickticket create rolebinding qt-deployer \
#     --role=qt-deployer --serviceaccount=quickticket:qt-deployer
#   kubectl -n quickticket apply -f - <<'EOF'
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: qt-deployer-token
#     namespace: quickticket
#     annotations: { kubernetes.io/service-account.name: qt-deployer }
#   type: kubernetes.io/service-account-token
#   EOF
#   TOKEN=$(kubectl -n quickticket get secret qt-deployer-token -o jsonpath='{.data.token}' | base64 -d)
#   SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
#   CA=$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')
#   cat <<EOF > qt-dev-kubeconfig
#   apiVersion: v1
#   kind: Config
#   clusters: [{name: k3s, cluster: {server: $SERVER, certificate-authority-data: $CA}}]
#   users: [{name: qt-deployer, user: {token: $TOKEN}}]
#   contexts: [{name: qt-dev, context: {cluster: k3s, user: qt-deployer, namespace: quickticket}}]
#   current-context: qt-dev
#   EOF
#   # paste the file's contents into repo secret QT_DEV_KUBECONFIG
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", "frontend/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

# one build at a time per branch; a new push to main supersedes a stale build
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/thegamecracks/quickticket-api
  WEB_IMAGE: ghcr.io/thegamecracks/quickticket-web

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.tag || 'dev' }}
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.tag || 'dev' }}
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # dev auto-deploy: only on main pushes, skipped (not failing) until the
  # QT_DEV_KUBECONFIG secret exists
  restart-dev:
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.QT_DEV_KUBECONFIG != ''
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: rollout restart quickticket dev
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.QT_DEV_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n quickticket rollout restart deploy/quickticket-dev deploy/quickticket-dev-web
          kubectl -n quickticket rollout status deploy/quickticket-dev --timeout=180s
          kubectl -n quickticket rollout status deploy/quickticket-dev-web --timeout=180s
