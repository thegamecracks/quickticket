name: Cleanup ghcr.io images

on:
  schedule:
    - cron: "0 0 * * *"  # every day at midnight
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run
        type: boolean
        required: true
        default: true

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          dry-run: ${{ inputs.dry_run }}
          packages: quickticket-api,quickticket-web
