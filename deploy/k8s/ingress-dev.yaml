# Traefik TCP IngressRoutes — DEV postgres/redis exposed on entryPoint outbound (:2459, traefik-external). TLS terminates at traefik with aerosol-tls.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: quickticket-postgres-dev
  namespace: quickticket
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - outbound
  routes:
    - match: HostSNI(`postgres-dev-qt.aerosol.dev`)
      services:
        - name: quickticket-postgres-dev
          port: 5432
  tls:
    secretName: aerosol-tls
    options:
      name: postgresql-alpn
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: quickticket-redis-dev
  namespace: quickticket
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - outbound
  routes:
    - match: HostSNI(`redis-dev-qt.aerosol.dev`)
      services:
        - name: quickticket-redis-dev
          port: 6379
  tls:
    secretName: aerosol-tls
---
# Advertise the postgres ALPN protocol so libpq handshakes succeed through traefik TLS termination.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: postgresql-alpn
  namespace: quickticket
spec:
  alpnProtocols:
    - postgresql
    - h2
    - http/1.1
