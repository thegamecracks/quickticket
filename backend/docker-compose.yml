services:
  backend:
    build: .
    ports:
      - 8000:8000
    env_file: .env  # copy from example.env
    environment:
      # Point the backend to our cache and database containers, taking precedence over .env.
      BACKEND__CACHE__URL: 'redis://default:abc123@cache:6379'  # 'sqlite:///data/quickticket-cache.db'
      BACKEND__DB__URL: 'postgresql+psycopg://quickticket:abc123@db:5432/quickticket?sslmode=prefer'  # 'sqlite+aiosqlite:///data/quickticket.db'
      FORCE_COLOR: '1'
    restart: always
    volumes:
      # Use this volume if either the cache or database are backed by SQLite.
      - backend-data:/app/data
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    pre_start:
      - command: ['alembic', 'upgrade', 'head']  # run migrations on startup
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  cache:
    # https://hub.docker.com/_/redis/
    image: docker.io/library/redis:8-alpine
    command:
      - 'redis-server'
      - '/usr/local/etc/redis/redis.conf'
      - '--requirepass'
      - '${REDIS_PASSWORD:-abc123}'
    ports:
      - 127.0.0.1:6379:6379
    environment:
      REDIS_ARGS: 'abc123'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 5s
      retries: 10
    restart: always
    volumes:
      - cache-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro

  db:
    # https://hub.docker.com/_/postgres/
    image: docker.io/library/postgres:18-alpine
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: 'quickticket'
      POSTGRES_DB: 'quickticket'
      POSTGRES_PASSWORD: 'abc123'
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8'
      # Healthcheck
      PGUSER: 'quickticket'
      PGDATABASE: 'quickticket'
      PGPASSWORD: 'abc123'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 1s
      timeout: 5s
      retries: 10
    restart: always
    volumes:
      - db-data:/var/lib/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro

  # TODO: add S3 (https://hub.docker.com/r/dxflrs/garage)

volumes:
  backend-data:
  cache-data:
  db-data:
